<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle Rim Glow -->
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Background Decorative Radar / Target Circles -->
  <circle cx="256" cy="226" r="140" fill="none" stroke="rgba(52, 211, 153, 0.15)" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="226" r="180" fill="none" stroke="rgba(52, 211, 153, 0.08)" stroke-width="2" />

  <!-- Central Shield -->
  <g filter="url(#shadow)">
    <path d="M 256 90 L 370 140 C 370 250 256 330 256 350 C 256 330 142 250 142 140 Z" fill="url(#shieldGrad)" />
    <!-- Shield Inner Bevel / Highlight -->
    <path d="M 256 104 L 354 148 C 354 242 256 314 256 332 C 256 314 158 242 158 148 Z" fill="#047857" opacity="0.6" />
  </g>

  <!-- Crosshairs / Targeting Device in Shield -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cross lines -->
    <line x1="256" y1="140" x2="256" y2="185" />
    <line x1="256" y1="245" x2="256" y2="290" />
    <line x1="190" y1="215" x2="230" y2="215" />
    <line x1="282" y1="215" x2="322" y2="215" />
    <!-- Center Target Ring -->
    <circle cx="256" cy="215" r="38" fill="none" stroke="#ffffff" stroke-width="10" />
    <!-- Target Bullseye Dot -->
    <circle cx="256" cy="215" r="14" fill="#34d399" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- Sparkles / High-efficiency Stars -->
  <path d="M 330 115 Q 345 115 345 100 Q 345 115 360 115 Q 345 115 345 130 Q 345 115 330 115 Z" fill="#fef08a" />
  <path d="M 150 160 Q 160 160 160 150 Q 160 160 170 160 Q 160 160 160 170 Q 160 160 150 160 Z" fill="#a7f3d0" />

  <!-- TECH / OPERATIONS Pill Badge at Bottom -->
  <g filter="url(#shadow)">
    <rect x="96" y="380" width="320" height="74" rx="37" fill="#0f172a" stroke="#10b981" stroke-width="4" />
    <text x="256" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      TECH PANEL
    </text>
  </g>
</svg>
